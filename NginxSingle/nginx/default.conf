# Zona de cache
fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=meu_cache:10m inactive=60m max_size=1g;

# Chave do cache
fastcgi_cache_key "$scheme$request_method$host$request_uri";

# Permite servir conteúdo stale em alguns erros
fastcgi_cache_use_stale error timeout invalid_header updating;

server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html;

    # Controle de cache
    set $no_cache 0;

    # Não cacheia POST (create/update/delete)
    if ($request_method = POST) {
        set $no_cache 1;
    }

    # Não cacheia edição via query string
    if ($query_string ~* "action=edit") {
        set $no_cache 1;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        # Caminho correto do script
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # --- CACHE ---
        fastcgi_cache meu_cache;
        fastcgi_cache_valid 200 10m;

        # Controle de bypass e escrita
        fastcgi_cache_bypass $no_cache;
        fastcgi_no_cache $no_cache;

        # Header para debug
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location ~ /\.ht {
        deny all;
    }
}