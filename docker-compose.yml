services:
  db:
    image: mysql:8.0
    container_name: nginx_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  proxysql:
    image: proxysql/proxysql:latest
    container_name: nginx_proxysql
    volumes:
      - ./proxysql.cnf:/etc/proxysql.cnf
    depends_on:
      - db
    restart: always

  php:
    build: ./php
    container_name: nginx_php_fpm
    env_file:
      - .env
    environment:
      DB_HOST: proxysql
    volumes:
      - ./src:/var/www/html
    depends_on:
      - proxysql
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: always