services:
  db:
    image: mysql:8.0
    container_name: lojinha_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    restart: always
    networks:
      - lojinha_network

  proxysql:
    image: proxysql/proxysql:latest
    container_name: lojinha_proxysql
    volumes:
      - ./proxysql.cnf:/etc/proxysql.cnf
    depends_on:
      - db
    restart: always
    networks:
      - lojinha_network

  java:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lojinha_java
    environment:
      DB_HOST: proxysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    ports:
      - "8081:8081"
    depends_on:
      - proxysql
    restart: always
    networks:
      - lojinha_network

  nginx:
    image: nginx:latest
    container_name: lojinha_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - java
    restart: always
    networks:
      - lojinha_network

volumes:
  mysql_data:

networks:
  lojinha_network:
    driver: bridge

