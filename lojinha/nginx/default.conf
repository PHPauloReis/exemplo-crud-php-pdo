server {
    listen 80;
    server_name localhost;

    # Proxy reverso para a aplicação Spring Boot
    location / {
        proxy_pass http://java:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        # O Nginx escuta internamente na porta 80, mas o Compose o expõe na 8080.
        # Informe a porta pública para que redirecionamentos do Spring a preservem.
        proxy_set_header X-Forwarded-Port 8080;
        proxy_redirect off;
    }
}
