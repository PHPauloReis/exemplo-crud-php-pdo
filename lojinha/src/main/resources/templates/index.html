<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 50px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4">Gerenciamento de Produtos</h2>

        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>

        <div class="row">
            <div class="col-md-4">
                <h4 th:if="${produtoEdit != null}">Editar Produto</h4>
                <h4 th:if="${produtoEdit == null}">Novo Produto</h4>
                <form method="POST" action="/">
                    <input type="hidden" name="id" th:value="${produtoEdit?.id}" th:if="${produtoEdit != null}">
                    <div class="mb-3">
                        <label class="form-label">Nome</label>
                        <input type="text" name="nome" class="form-control" required th:value="${produtoEdit?.nome}" placeholder="Digite o nome do produto">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Preço</label>
                        <input type="number" step="0.01" name="preco" class="form-control" required th:value="${produtoEdit?.preco}" placeholder="0.00">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quantidade</label>
                        <input type="number" name="quantidade" class="form-control" required th:value="${produtoEdit?.quantidade}" placeholder="0">
                    </div>
                    <div th:if="${produtoEdit != null}">
                        <button type="submit" name="update" value="1" class="btn btn-warning">Atualizar</button>
                        <a href="/" class="btn btn-secondary">Cancelar</a>
                    </div>
                    <div th:if="${produtoEdit == null}">
                        <button type="submit" name="create" value="1" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>

            <div class="col-md-8">
                <h4>Lista de Produtos</h4>
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Qtd</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${produtos}">
                            <td th:text="${p.id}"></td>
                            <td th:text="${p.nome}"></td>
                            <td th:text="${'R$ ' + #numbers.formatDecimal(p.preco, 1, 2, 'POINT')}"></td>
                            <td th:text="${p.quantidade}"></td>
                            <td>
                                <a th:href="@{/?action=edit&id={id}(id=${p.id})}" class="btn btn-sm btn-info text-white">Editar</a>
                                <form method="POST" action="/" class="d-inline">
                                    <input type="hidden" name="id" th:value="${p.id}">
                                    <button type="submit" name="delete" value="1" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja deletar este produto?')">Deletar</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(produtos)}">
                            <td colspan="5" class="text-center">Nenhum produto encontrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
